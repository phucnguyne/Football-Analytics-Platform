services:
  postgres:
    image: postgres:16-alpine3.21
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"          # đổi 1: chỉ máy bạn truy cập được
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]   # đổi 2: đúng với user trong .env
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine3.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"          # đổi 1: chỉ máy bạn truy cập được
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    profiles: ["prod"]                 # đổi 3: chỉ build/chạy khi bạn chủ động gọi
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV:     production
    env_file:
      - ./apps/web/.env

volumes:
  postgres_data:
  redis_data: