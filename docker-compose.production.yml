services:
  redis:
    image: redis:7-alpine3.21
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: pnpm --filter @app/api start
    env_file: deploy/.env.production
    environment:
      NODE_ENV: production
      PORT: 3002
      HOST: 0.0.0.0
      REALTIME_INTERNAL_URL: http://realtime:3001
    depends_on:
      realtime:
        condition: service_started

  realtime:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: node apps/realtime/dist/server.js
    env_file: deploy/.env.production
    environment:
      NODE_ENV: production
      REALTIME_PORT: 3001
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      redis:
        condition: service_healthy

  sync-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    restart: unless-stopped
    command: pnpm db:sync-live:watch
    env_file: deploy/.env.production
    environment:
      NODE_ENV: production
      REALTIME_INTERNAL_URL: http://realtime:3001
    depends_on:
      realtime:
        condition: service_started

volumes:
  redis_data:
